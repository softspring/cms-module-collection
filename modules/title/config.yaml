module:
    meta:
        ai_instructions: |
            Use for a standalone heading. Choose its level from the available options according to the page hierarchy; reserve the main heading for the page title and keep subsequent levels coherent. Do not use heading text as a substitute for body paragraphs.
    revision: 1
    group: 'basic'
    edit_template: '@module/title/edit.html.twig'
    form_template: '@module/title/form.html.twig'
    module_options:
        form_fields:
            id:
                type: 'id'

            class:
                type: 'class'

            type:
                type: 'choice'
                type_options:
                    default_value: h1
                    choices:
                        "title.form.type.values.h1": h1
                        "title.form.type.values.h2": h2
                        "title.form.type.values.h3": h3
                        "title.form.type.values.h4": h4
                        "title.form.type.values.h5": h5
                        "title.form.type.values.h6": h6

            title:
                type: 'translation'
                type_options:
                    default_locale_type_options:
                        constraints: [ 'notBlank' ]
