module:
    meta:
        ai_instructions: |
            Use this module for rich HTML that cannot be expressed clearly with the available semantic modules. Prefer paragraph modules for ordinary paragraphs and dedicated heading, list or media modules when available. Avoid putting an entire page into one wysiwyg instance.
    revision: 3
    group: 'basic'
    edit_template: '@module/wysiwyg/edit.html.twig'
    form_template: '@module/wysiwyg/form.html.twig'
    module_options:
        form_fields:
            id:
                type: 'id'

            class:
                type: 'class'

            html_content:
                type: 'html'

