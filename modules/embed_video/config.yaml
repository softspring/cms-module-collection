module:
    meta:
        ai_instructions: |
            Use for the embed markup of a video, not for general body text or an arbitrary page layout. Provide the intended video embed in the code field and review the rendered result. Use the media module when selecting an existing CMS media item instead.
    revision: 1
    group: 'basic'
    edit_template: '@module/embed_video/edit.html.twig'
    form_template: '@module/embed_video/form.html.twig'
    render_template: '@module/embed_video/render.html.twig'
    module_options:
        label_format: 'modules.embed_video.%%name%%.label'
        form_fields:
            id:
                type: 'id'

            class:
                type: 'class'

            code:
                type: 'html'
                type_options:
                    attr:
                        style: 'min-height: 400px'
