module:
    meta:
        ai_instructions: |
            Use one instance for each ordinary paragraph. Prefer paragraph modules over wysiwyg for normal body copy so that paragraphs remain independently editable. Use the configured translation fields for each locale.
    revision: 1
    group: 'basic'
    edit_template: '@module/paragraph/edit.html.twig'
    form_template: '@module/paragraph/form.html.twig'
    module_options:
        form_fields:
            id:
                type: 'id'

            class:
                type: 'class'

            paragraph:
                type: 'translation'
                type_options:
                    type: 'textarea'
                    default_locale_type_options:
                        constraints: [ 'notBlank' ]
