module:
    meta:
        ai_instructions: |
            Use for a genuine quotation or a short highlighted excerpt. Keep the wording faithful to its source and do not invent an attribution. Use paragraph modules for ordinary body copy and supply the requested language values.
    revision: 1
    group: 'basic'
    edit_template: '@module/quote/edit.html.twig'
    form_template: '@module/quote/form.html.twig'
    module_options:
        form_fields:
            id:
                type: 'id'

            class:
                type: 'class'

            quote:
                type: 'translation'
                type_options:
                    type: 'textarea'
                    default_locale_type_options:
                        constraints: [ 'notBlank' ]
